[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-vision"
version = "0.1.0"
description = "Modular multi-person computer vision platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.18.1,<2",
    "opencv-python>=4.9,<5",
    "ultralytics>=8.3,<9",
    "PyYAML>=6,<7",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
