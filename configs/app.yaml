
app:
  name: "Company Vision"
  version: "1.0"
  environment: "development"
  log_level: "INFO"

camera:
  camera_id: "office_cam_01"
  source_type: "video"
  width: 1920
  height: 1080
  target_fps: 15
  reconnect_seconds: 5

models:
  device: "cuda:0"
  pose_model: "yolo26n-pose.pt"
  detection_model: "yolo26n.pt"
  pose_confidence: 0.40
  detection_confidence: 0.35

tracking:
  tracker: "bytetrack.yaml"
  min_confidence: 0.30

privacy:
  save_raw_frames: false
  save_face_crops: false
  save_observations: false
  retention_days: 0
